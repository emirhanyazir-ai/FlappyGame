<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flappy Bird Game</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            font-family: Arial, sans-serif;
        }

        #gameContainer {
            position: relative;
            width: 400px;
            height: 600px;
            background: linear-gradient(180deg, #87CEEB 0%, #E0F6FF 100%);
            border: 3px solid #333;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
        }

        #bird {
            position: absolute;
            width: 40px;
            height: 40px;
            background: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 40"><circle cx="20" cy="20" r="18" fill="%23FFD700"/><path d="M 28 18 L 35 15 L 30 20 L 35 25 L 28 22" fill="%23FFA500"/><circle cx="25" cy="18" r="3" fill="%23000"/></svg>') no-repeat center;
            background-size: contain;
            left: 50px;
            top: 300px;
            border-radius: 50%;
        }

        .pipe {
            position: absolute;
            background: linear-gradient(90deg, #228B22 0%, #32CD32 100%);
            border: 2px solid #1a6b1a;
        }

        .pipe-top {
            top: 0;
        }

        .pipe-bottom {
            bottom: 0;
        }

        #score {
            position: absolute;
            top: 20px;
            left: 20px;
            font-size: 28px;
            font-weight: bold;
            color: #333;
            z-index: 10;
        }

        #gameOver {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0, 0, 0, 0.9);
            padding: 40px;
            border-radius: 10px;
            text-align: center;
            color: white;
            display: none;
            z-index: 20;
            font-size: 24px;
        }

        #gameOver h1 {
            font-size: 40px;
            margin-bottom: 20px;
            color: #FFD700;
        }

        #finalScore {
            font-size: 32px;
            margin: 20px 0;
            color: #FFD700;
        }

        #restartBtn {
            margin-top: 20px;
            padding: 12px 30px;
            font-size: 18px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            transition: background 0.3s;
        }

        #restartBtn:hover {
            background: #764ba2;
        }

        #instructions {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            color: #333;
            font-size: 14px;
            text-align: center;
            z-index: 5;
        }
    </style>
</head>
<body>
    <div id="gameContainer">
        <div id="score">Score: 0</div>
        <div id="bird"></div>
        <div id="gameOver">
            <h1>GAME OVER!</h1>
            <div id="finalScore">Score: 0</div>
            <button id="restartBtn">Play Again</button>
        </div>
        <div id="instructions">Click or Press Space to Flap</div>
    </div>

    <script>
        const gameContainer = document.getElementById('gameContainer');
        const bird = document.getElementById('bird');
        const scoreDisplay = document.getElementById('score');
        const gameOverScreen = document.getElementById('gameOver');
        const finalScoreDisplay = document.getElementById('finalScore');
        const restartBtn = document.getElementById('restartBtn');

        let birdY = 300;
        let birdX = 50;
        let birdVelocity = 0;
        let score = 0;
        let gameActive = true;
        const gravity = 0.5;
        const jumpPower = -10;
        const pipeGap = 120;
        const pipeWidth = 50;
        const pipeSpacing = 150;

        let pipes = [];
        let pipeCounter = 0;

        // Update bird position
        function updateBird() {
            if (!gameActive) return;

            birdVelocity += gravity;
            birdY += birdVelocity;

            bird.style.top = birdY + 'px';

            // Check boundaries
            if (birdY + 40 > 600 || birdY < 0) {
                endGame();
            }

            // Check collision with pipes
            checkCollision();
        }

        // Create pipes
        function createPipe() {
            if (!gameActive) return;

            const randomGap = Math.random() * (400 - pipeGap);
            const topPipeHeight = randomGap;
            const bottomPipeY = topPipeHeight + pipeGap;

            const topPipe = document.createElement('div');
            topPipe.className = 'pipe pipe-top';
            topPipe.style.width = pipeWidth + 'px';
            topPipe.style.height = topPipeHeight + 'px';
            topPipe.style.left = '400px';
            gameContainer.appendChild(topPipe);

            const bottomPipe = document.createElement('div');
            bottomPipe.className = 'pipe pipe-bottom';
            bottomPipe.style.width = pipeWidth + 'px';
            bottomPipe.style.height = (600 - bottomPipeY) + 'px';
            bottomPipe.style.left = '400px';
            gameContainer.appendChild(bottomPipe);

            pipes.push({
                x: 400,
                topHeight: topPipeHeight,
                bottomY: bottomPipeY,
                topElement: topPipe,
                bottomElement: bottomPipe,
                scored: false
            });
        }

        // Update pipes
        function updatePipes() {
            if (!gameActive) return;

            pipes.forEach((pipe, index) => {
                pipe.x -= 5;
                pipe.topElement.style.left = pipe.x + 'px';
                pipe.bottomElement.style.left = pipe.x + 'px';

                // Score point
                if (pipe.x === birdX && !pipe.scored) {
                    score++;
                    scoreDisplay.textContent = 'Score: ' + score;
                    pipe.scored = true;
                }

                // Remove off-screen pipes
                if (pipe.x + pipeWidth < 0) {
                    pipe.topElement.remove();
                    pipe.bottomElement.remove();
                    pipes.splice(index, 1);
                }
            });

            pipeCounter++;
            if (pipeCounter > 100) {
                createPipe();
                pipeCounter = 0;
            }
        }

        // Check collision
        function checkCollision() {
            pipes.forEach(pipe => {
                if (birdX + 40 > pipe.x && birdX < pipe.x + pipeWidth) {
                    if (birdY < pipe.topHeight || birdY + 40 > pipe.bottomY) {
                        endGame();
                    }
                }
            });
        }

        // End game
        function endGame() {
            gameActive = false;
            gameOverScreen.style.display = 'block';
            finalScoreDisplay.textContent = 'Score: ' + score;
        }

        // Restart game
        function restartGame() {
            birdY = 300;
            birdVelocity = 0;
            score = 0;
            gameActive = true;
            pipeCounter = 0;

            // Clear pipes
            pipes.forEach(pipe => {
                pipe.topElement.remove();
                pipe.bottomElement.remove();
            });
            pipes = [];

            gameOverScreen.style.display = 'none';
            scoreDisplay.textContent = 'Score: 0';
            bird.style.top = birdY + 'px';
        }

        // Handle flap
        function flap() {
            if (gameActive) {
                birdVelocity = jumpPower;
            }
        }

        // Event listeners
        document.addEventListener('click', flap);
        document.addEventListener('keydown', (e) => {
            if (e.code === 'Space') {
                e.preventDefault();
                flap();
            }
        });

        restartBtn.addEventListener('click', restartGame);

        // Game loop
        setInterval(updateBird, 20);
        setInterval(updatePipes, 20);

        // Start game
        createPipe();
    </script>
</body>
</html>
